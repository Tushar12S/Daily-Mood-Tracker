<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Daily Mood Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <h1>How Are You Feeling Today?</h1>
    
    <div class="mood-options">
      <input type="radio" name="mood" id="happy" />
      <label for="happy" class="mood happy">😊<span>Happy</span></label>

      <input type="radio" name="mood" id="sad" />
      <label for="sad" class="mood sad">😢<span>Sad</span></label>

      <input type="radio" name="mood" id="excited" />
      <label for="excited" class="mood excited">🤩<span>Excited</span></label>

      <input type="radio" name="mood" id="calm" />
      <label for="calm" class="mood calm">😌<span>Calm</span></label>
    </div>
  </div>
</body>
</html>
